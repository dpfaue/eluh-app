<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ELUH App</title>
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ELUH">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/auftraege" aria-label="Start">
      <span class="brand-mark">eluh</span>
      <span class="brand-text">Kundendienst</span>
    </a>
    <nav class="tabs" aria-label="Hauptbereiche">
      <a href="#/auftraege" data-tab="auftraege">Aufträge</a>
      <a href="#/kunden" data-tab="kunden">Kunden</a>
      <a href="#/sync" data-tab="sync">Sync</a>
    </nav>
    <button class="sync-pill" id="syncPill" type="button" aria-live="polite">…</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottombar" aria-label="Hauptbereiche">
    <a href="#/auftraege" data-tab="auftraege">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M10 13h6M10 17h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Aufträge</span>
    </a>
    <a href="#/kunden" data-tab="kunden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Kunden</span>
    </a>
    <a href="#/sync" data-tab="sync">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16m0 4v-4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Sync</span>
    </a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>
  <div id="updateBar" class="update-bar" hidden>
    <span>Neue App-Version verfügbar</span>
    <button type="button" id="updateBtn">Jetzt aktualisieren</button>
  </div>

  <script src="config.js"></script>
  <script src="pdf-lib.min.js"></script>
  <script src="store.js"></script>
  <script src="pdfgen.js"></script>
  <script src="offline.js"></script>
  <script src="app.js"></script>
</body>
</html>
